name: Feature request
description: Propose an option or behaviour for MixedText
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Keep the public API small.
      render: tsx
